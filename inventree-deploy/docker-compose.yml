services:
  inventree-db:
    image: postgres:17
    container_name: inventree-db
    expose:
      - ${INVENTREE_DB_PORT:-5432}/tcp
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdb
      - POSTGRES_USER=${INVENTREE_DB_USER:?Set INVENTREE_DB_USER in .env}
      - POSTGRES_PASSWORD=${INVENTREE_DB_PASSWORD:?Set INVENTREE_DB_PASSWORD in .env}
      - POSTGRES_DB=${INVENTREE_DB_NAME:?Set INVENTREE_DB_NAME in .env}
    volumes:
      - ${INVENTREE_EXT_VOLUME:?Set INVENTREE_EXT_VOLUME in .env}:/var/lib/postgresql/data/:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  inventree-cache:
    image: redis:7-alpine
    container_name: inventree-cache
    command: redis-server --save "" --appendonly no
    env_file:
      - .env
    expose:
      - ${INVENTREE_CACHE_PORT:-6379}
    volumes:
      - ${INVENTREE_EXT_VOLUME}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  inventree-server:
    image: ${INVENTREE_IMAGE:-inventree/inventree:stable}
    container_name: inventree-server
    expose:
      - ${INVENTREE_WEB_PORT:-8000}
    depends_on:
      inventree-db:
        condition: service_healthy
      inventree-cache:
        condition: service_healthy
    env_file:
      - .env
    environment:
      INVENTREE_SERVER: http://inventree-server:${INVENTREE_WEB_PORT}
    volumes:
      - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:8000/api/system/health/",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  inventree-worker:
    image: ${INVENTREE_IMAGE:-inventree/inventree:stable}
    container_name: inventree-worker
    command: invoke worker
    depends_on:
      inventree-server:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${INVENTREE_EXT_VOLUME}:/home/inventree/data:z
    restart: unless-stopped

  inventree-proxy:
    image: caddy:alpine
    container_name: inventree-proxy
    restart: always
    depends_on:
      inventree-server:
        condition: service_healthy
    ports:
      - 0.0.0.0:${INVENTREE_HTTP_PORT:-80}:80
      - 0.0.0.0:${INVENTREE_HTTPS_PORT:-443}:443
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ${INVENTREE_EXT_VOLUME}/static:/var/www/static:z
      - ${INVENTREE_EXT_VOLUME}/media:/var/www/media:z
      - ${INVENTREE_EXT_VOLUME}:/var/log:z
      - ${INVENTREE_EXT_VOLUME}:/data:z
      - ${INVENTREE_EXT_VOLUME}:/config:z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate --quiet --spider https://$${INVENTREE_SITE_HOST}/api/system/health/",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
